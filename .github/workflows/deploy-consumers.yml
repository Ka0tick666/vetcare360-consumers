name: CI/CD Consumers VetCare360

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vetcare360-consumers-production
  cancel-in-progress: false

jobs:
  ci:
    name: Validar y construir
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Validar codigo
        run: |
          test -s shared/kafka.mjs
          test -s logs/index.mjs
          node --check shared/kafka.mjs
          node --check logs/index.mjs

      - name: Construir imagen Docker
        run: docker build -t vetcare360-consumers:${{ github.sha }} .

  cd:
    name: Desplegar en EC2 mediante SSM
    needs: ci
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Desplegar consumidor
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          REMOTE_COMMAND="sudo -iu ec2-user bash -c 'set -e; cd /home/ec2-user/vetcare360-consumers; git fetch origin main; git merge --ff-only $COMMIT_SHA; test \"\$(git rev-parse HEAD)\" = $COMMIT_SHA; docker compose config --quiet; docker compose build; docker compose up -d logs; sleep 15; docker compose ps; docker compose logs --tail=30 logs; test \"\$(docker inspect -f {{.State.Running}} vetcare360-consumer-logs)\" = true'"

          PARAMETERS=$(jq -n --arg cmd "$REMOTE_COMMAND" '{commands:[$cmd]}')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "$PARAMETERS" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          RESULT=0

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" || RESULT=$?

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,Output:StandardOutputContent,Errors:StandardErrorContent}' \
            --output json

          exit "$RESULT"

services:
  logs:
    build: .
    container_name: vetcare360-consumer-logs
    restart: unless-stopped
    network_mode: host
    env_file:
      - .env
    command: ["node", "logs/index.mjs"]
    mem_limit: 192m
    environment:
      NODE_OPTIONS: "--max-old-space-size=128"
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
